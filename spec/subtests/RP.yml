id: RP
name: "Rotazioni e Prospettive"
domain: Gv
role: core
contributes_to: [qVS, QI_totale]
response_format: multiple_choice_4
stimulus_mode: visual
construct: "Rotazione mentale, costanza di forma e coerenza prospettica."
item_ordering: increasing_difficulty
n_scored_items: 20
n_practice_items: 2
scoring: {type: dichotomous, item_scores: [0, 1], raw_min: 0, raw_max: 20, full_credit_for_below_basal: 1}
timing: {planned_minutes: [8, 10]}
administration:
  route_type: adaptive_items
  start_points:
    - {age_months: [72, 107], item: 1}
    - {age_months: [108, 155], item: 4}
    - {age_months: [156, 263], item: 7}
  inversion: {initial_window_items: 3, trigger: {correct_lt: 2}, direction: backward}
  basal: {window_items: 3, correct: 3}
  ceiling: {consecutive_items: 3, item_score: 0}
