id: SM
name: "Sequenze e Manipolazione"
domain: Gwm
role: core
contributes_to: [qML, QI_totale]
response_format: oral_sequence_response
stimulus_mode: auditory_verbal
construct: "Mantenimento, manipolazione e updating di sequenze."
item_ordering: increasing_difficulty_within_microblock
n_scored_items: 24
n_practice_items: 0
microblocks: [backward_repetition, rule_based_reordering, running_span]
scoring: {type: dichotomous, item_scores: [0, 1], raw_min: 0, raw_max: 24, full_credit_for_below_basal: 1}
timing: {planned_minutes: [10, 12]}
administration:
  route_type: adaptive_levels_by_microblock
  start_points:
    - {age_months: [72, 107], sequence_length: 2}
    - {age_months: [108, 155], sequence_length: 3}
    - {age_months: [156, 263], sequence_length: 4}
  inversion: {initial_consecutive_failures: 2, direction: lower_level}
  basal: {consecutive_correct: 2, same_level: true}
  ceiling: {consecutive_errors: 3, same_level: true}
