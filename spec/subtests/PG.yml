id: PG
name: "Posizioni su Griglia"
domain: Gwm
role: completion
contributes_to: [qML]
response_format: constructed_position_sequence
stimulus_mode: visual
stimulus_production: symbol_grid
construct: "Memoria di lavoro visuo-spaziale per sequenze di posizioni."
item_ordering: increasing_difficulty
n_scored_items: 16
n_practice_items: 2
grid_size: [4, 4]
cell_notation: "colonna A-D + riga 1-4, per esempio B3"
item_bank:
  path: items/source/PG.csv
  status: complete_draft
  n_scored_items_current: 16
scoring: {type: dichotomous, item_scores: [0, 1], raw_min: 0, raw_max: 16, full_credit_for_below_basal: 1}
timing: {planned_minutes: [6, 8]}
administration:
  route_type: adaptive_levels
  start_points:
    - {age_months: [72, 107], sequence_length: 2}
    - {age_months: [108, 155], sequence_length: 3}
    - {age_months: [156, 263], sequence_length: 4}
  trials_per_level: 2
  inversion: {initial_consecutive_failures: 2, direction: lower_level}
  basal: {consecutive_correct: 2, same_level: true}
  ceiling: {consecutive_errors: 2, same_level: true}
